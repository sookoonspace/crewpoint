name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 'Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: 'Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: 'Docs'
    labels:
      - 'docs'
      - 'documentation'
  - title: 'Chores'
    labels:
      - 'chore'
      - 'dependencies'
      - 'ci'
  - title: 'Breaking changes'
    labels:
      - 'breaking'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - 'breaking'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
      - 'docs'
      - 'documentation'
      - 'chore'
      - 'dependencies'
      - 'ci'
  default: patch

template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/sookoonspace/crewpoint/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
