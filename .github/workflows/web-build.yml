name: Web Build

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'firebase.json'

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned deliberately. An unpinned `channel: stable` silently
          # follows every new Flutter release, so CI's analyzer and test
          # runner can change under a PR for reasons unrelated to it. That
          # happened during PR #28: CI moved to 3.47.0 while local was on
          # 3.44.8 and failed a gate the change had not broken. Bump this
          # on purpose, with a full gate, not by surprise.
          flutter-version: 3.47.0
          cache: true

      - name: Cache pub-cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web (release, dev flavor)
        run: flutter build web --release --dart-define=FLAVOR=dev
