# Per-flavor launcher icon config for the staging build (bundle id
# `space.sookoon.crewpoint.stg`).
#
# Android: writes assets into `android/app/src/stg/res/mipmap-*/` via
# the `flavor:` directive.
#
# iOS: writes directly to `AppIcon-stg.appiconset/` because
# flutter_launcher_icons 0.14+ uses this yaml's filename suffix as
# the iconset directory name. `ios/stg.xcconfig` points
# `ASSETCATALOG_COMPILER_APPICON_NAME` at that directory.
#
# See `flutter_launcher_icons-dev.yaml` for the full workflow rationale.

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher_icon_stg.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#2D3436"  # AppColors.charcoal
  adaptive_icon_foreground: "assets/icons/launcher_icon_stg.png"
  flavor: "stg"
