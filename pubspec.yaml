name: crewpoint_app
description: CrewPoint - Collaborative Event Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  lottie: ^3.3.1
  flutter_svg: ^2.0.0
  # flutter_markdown was archived by the Flutter team in 2024;
  # flutter_markdown_plus is the actively-maintained drop-in
  # successor (last release 2025-12-28; supports Flutter 3.27.1+).
  flutter_markdown_plus: ^1.0.7

  # State Management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.4
  cloud_functions: ^5.3.3
  firebase_messaging: ^15.2.0

  # OS launcher app-icon badge — Phase 3b.2.
  # AppBadgePlus.updateBadge(int) on iOS / Android / macOS.
  # Notification permissions are inherited from firebase_messaging
  # (FcmService.attach()); Android OEM-specific permissions are declared
  # in AndroidManifest.xml for Samsung / Huawei / HTC / Sony / etc.
  app_badge_plus: ^1.2.10

  # Auth
  # Note: google_sign_in and sign_in_with_apple were both removed —
  # Firebase Auth's GoogleAuthProvider + AppleAuthProvider drive OAuth
  # on every platform via the firebase_auth SDK directly. iOS/Android
  # use signInWithProvider (system sheet / Custom Tab); web uses
  # signInWithPopup (signInWithProvider is unimplemented on web).
  # See ai_specs/auth-google-mobile-fix-plan.md for context.

  # Local Database
  drift: ^2.25.0
  # HELD at 0.5.x deliberately — do not "upgrade" to 0.6.0+eol.
  # That release is an intentionally *emptied* package: upstream
  # deprecated it and stripped all its code, because sqlite3 3.x ships
  # the native libraries itself. Taking it removes the iOS/Android
  # native SQLite build integration Drift depends on; it is a removal
  # wearing a version bump.
  # The real migration is sqlite3 2.x -> 3.x, which requires
  # drift >= 2.32.1, whose drift_dev requires analyzer >= 10.0.0 — see
  # the analyzer ceiling under dev_dependencies. Blocked until that
  # ceiling moves, so revisit the two together.
  sqlite3_flutter_libs: ^0.5.32

  # Security
  envied: ^1.1.1
  # HELD at 10.x. 11.0.0 raises compileSdk to 37, which AGP 8.11.1 cannot
  # resolve: it emits the legacy `android-37` target hash while Google now
  # publishes only minor-API-level platforms (android-37.0 / 37.1). No SDK
  # install fixes that — it needs an AGP that understands minor API levels.
  # 10.3.1 already ships flutter_secure_storage_darwin, so the discontinued
  # flutter_secure_storage_macos impl is gone either way. Tracked separately.
  flutter_secure_storage: ^10.3.1
  # Theme preference persistence (non-sensitive — secure_storage is overkill).
  shared_preferences: ^2.3.0

  # Utilities
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  yaml: ^3.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  clock: ^1.1.1
  # Grapheme-aware string ops (TaskModel.duplicate truncation). Ships
  # with Flutter; declared explicitly to satisfy depend_on_referenced.
  characters: ^1.4.0

  # Reporting (PDF + CSV exports)
  pdf: ^3.11.0
  printing: ^5.13.0
  csv: ^8.0.0
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used only by scripts/build_legal_html.dart to render Markdown
  # source into the hosted /privacy + /terms HTML pages.
  markdown: ^7.3.0
  build_runner: ^2.4.15
  envied_generator: ^1.1.1
  drift_dev: ^2.25.0
  # --- Analyzer ceiling: read this before bumping anything below ---
  # `analyzer` is capped below 9 by the lint chain:
  #   custom_lint_core 0.8.1 -> analyzer ^8.0.0
  #   riverpod_lint    3.0.3 -> analyzer >=7.0.0 <9.0.0
  # drift_dev 2.31.0 permits analyzer >=8.1.0 <11.0.0, so drift is a
  # victim of the cap rather than a cause of it.
  #
  # Consequence: analyzer, drift, drift_dev, build_runner and sqlite3 all
  # stay where they are, and the sqlite3_flutter_libs EOL migration noted
  # above is unreachable (drift_dev 2.32.1 wants analyzer >= 10.0.0).
  # This is a deliberate trade: riverpod_lint guards the 36 hand-written
  # providers in lib/app/core/providers.dart, and CONTRIBUTING §Style
  # tells contributors to run `dart run custom_lint`. Lint coverage was
  # chosen over version currency — see GitHub issue #16 [L3].
  #
  # Removing riverpod_annotation / riverpod_generator (Wave 1) did NOT
  # lift this cap: riverpod_lint pulls the same riverpod_analyzer_utils
  # -> custom_lint_core path, and custom_lint carries it independently.
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.5.3
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1
  # sqlite3 is a transitive dep via sqlite3_flutter_libs; declared here
  # so test/database/migration_v5_to_v6_test.dart can import it cleanly
  # to seed a v5-shaped DB before Drift's MigrationStrategy runs.
  sqlite3: ^2.4.0

# Launcher icon configs live in per-flavor YAML files at the project
# root: `flutter_launcher_icons-{main,dev,stg}.yaml`.
#
# Android only: `dart run flutter_launcher_icons -f flutter_launcher_icons-dev.yaml`
# (or run all three at once with `dart run flutter_launcher_icons`).
#
# iOS + Android (recommended): `bash scripts/generate_ios_per_flavor_icons.sh`.
# That wrapper runs each yaml in the right order and renames the iOS
# iconset directory per flavor (AppIcon-dev / AppIcon-stg / AppIcon)
# because flutter_launcher_icons can only write to AppIcon.appiconset
# directly. The per-flavor xcconfigs at ios/{dev,stg,prod}.xcconfig
# point ASSETCATALOG_COMPILER_APPICON_NAME at the matching iconset.
#
# Adaptive icons (Android 8.0+) use #2D3436 (AppColors.charcoal) as the
# background layer so the device-specific mask gets a brand-aligned
# colour while the foreground stays full-size.

flutter:
  # Pin iOS/macOS dependency management to CocoaPods for the duration of the
  # dependency refresh (GitHub #16). Flutter 3.44 stable has Swift Package
  # Manager `enabledByDefault: true`, so an ordinary `flutter run -d ios`
  # silently migrates the project: it strips ios/Podfile.lock from 1608 lines
  # to 22, rewrites project.pbxproj to add FlutterGeneratedPluginSwiftPackage
  # and drop the [CP] Copy Pods Resources phase, adds a scheme PreAction, and
  # writes swiftpm/Package.resolved files.
  #
  # That migration is fine on its own merits — it passed the Wave 1 iOS boot
  # smoke — but it must not land during the refresh. Wave 3 upgrades the whole
  # Firebase suite and raises the iOS deployment target via ios/Podfile
  # (Spec #16 requirements 19-20); swapping the iOS dependency manager at the
  # same time would make an iOS failure unattributable between the two.
  #
  # This project-level setting outranks both the global `flutter config` value
  # and the FLUTTER_SWIFT_PACKAGE_MANAGER env var, and is scoped to this repo.
  # Adopting SPM deliberately is tracked separately — remove this block then.
  config:
    enable-swift-package-manager: false

  uses-material-design: true
  assets:
    - assets/animations/
    - assets/legal/
    - assets/images/auth/
