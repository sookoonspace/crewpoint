name: crewpoint_app
description: CrewPoint - Collaborative Event Management App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.3.1

  # State Management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Navigation
  go_router: ^14.8.1

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  firebase_storage: ^12.4.4
  cloud_functions: ^5.3.3

  # Auth
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Local Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.32

  # Security
  envied: ^1.1.1
  flutter_secure_storage: ^9.2.4

  # Utilities
  image_picker: ^1.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  path: ^1.9.1
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.15
  envied_generator: ^1.1.1
  drift_dev: ^2.25.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.5.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
