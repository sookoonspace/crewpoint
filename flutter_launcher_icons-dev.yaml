# Per-flavor launcher icon config for the dev build (bundle id
# `space.sookoon.crewpoint.dev`). Run with:
#
#   dart run flutter_launcher_icons -f flutter_launcher_icons-dev.yaml
#
# Writes Android assets into `android/app/src/dev/res/mipmap-*/` via
# the `flavor:` directive. iOS xcassets only carry one variant in this
# project — leave `ios: false` until the asset catalog is split per
# flavor (separate follow-up).

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/launcher_icon_dev.png"
  adaptive_icon_background: "#2D3436"  # AppColors.charcoal
  adaptive_icon_foreground: "assets/icons/launcher_icon_dev.png"
  flavor: "dev"
