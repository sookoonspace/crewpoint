# Per-flavor launcher icon config for the dev build (bundle id
# `space.sookoon.crewpoint.dev`).
#
# Android: writes assets into `android/app/src/dev/res/mipmap-*/` via
# the `flavor:` directive.
#
# iOS: flutter_launcher_icons 0.14+ derives the iconset directory name
# from this yaml's filename suffix — so running with `-f flutter_launcher_icons-dev.yaml`
# writes directly to `ios/Runner/Assets.xcassets/AppIcon-dev.appiconset/`.
# `ios/dev.xcconfig` points `ASSETCATALOG_COMPILER_APPICON_NAME` at that
# directory. The helper script generates all three flavors in one shot:
#
#   bash scripts/generate_ios_per_flavor_icons.sh

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher_icon_dev.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#2D3436"  # AppColors.charcoal
  adaptive_icon_foreground: "assets/icons/launcher_icon_dev.png"
  flavor: "dev"
