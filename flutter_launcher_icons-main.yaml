# Default / prod launcher icon config (bundle id
# `space.sookoon.crewpoint.app` on Android, used by App Store builds).
#
# Android: writes assets into `android/app/src/main/res/mipmap-*/` —
# Gradle's default source set — because no `flavor:` is set.
#
# iOS: flutter_launcher_icons 0.14+ derives the iconset directory name
# from this yaml's filename suffix, so it writes to
# `ios/Runner/Assets.xcassets/AppIcon-main.appiconset/`.
# `ios/prod.xcconfig` points `ASSETCATALOG_COMPILER_APPICON_NAME` at
# that directory.
#
# Run with:
#   bash scripts/generate_ios_per_flavor_icons.sh   (recommended — does all 3)
#   dart run flutter_launcher_icons -f flutter_launcher_icons-main.yaml   (this one)

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#2D3436"  # AppColors.charcoal
  adaptive_icon_foreground: "assets/icons/launcher_icon.png"
